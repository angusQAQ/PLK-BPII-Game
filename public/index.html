<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf6ee">
  <meta name="description" content="給小二學生的外貌描寫遊戲。選一張詞卡，製作自己的玩偶，學習用粵語和完整句子描寫外貌。">
  <title>玩偶小工房</title>
  <link rel="icon" href="./assets/runtime/brand.webp" type="image/webp">
  <link rel="stylesheet" href="./style.css" crossorigin="anonymous">
  <link rel="stylesheet" href="./runtime.css" crossorigin="anonymous">
</head>
<body>
  <div id="app"><main class="boot-screen" role="status"><h1>玩偶小工房</h1><p>遊戲載入中……</p><a class="reload-link" href="./" role="button" data-reload>重新載入</a></main></div>
  <div id="load-status" class="load-status" role="alert" hidden><span>圖片未能載入</span><a class="reload-link" href="./" role="button" data-reload>重新載入</a></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <canvas id="celebration" aria-hidden="true" hidden></canvas>
  <script src="./boot.js" crossorigin="anonymous" defer></script>

</html>

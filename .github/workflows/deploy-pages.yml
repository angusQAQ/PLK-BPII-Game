name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test tools
        run: npm ci
      - name: Install WebKit for Safari display checks
        run: npx playwright install --with-deps webkit
      - name: Prepare optimized game assets
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run prepare:runtime
      - name: Test the complete game
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          npm run dev > /tmp/atelier-server.log 2>&1 &
          atelier_server_pid=$!
          trap 'kill "$atelier_server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:3000/ > /dev/null
          npm test
          node tests/performance.test.mjs
          node tests/preview.test.mjs
          BROWSER_ENGINE=webkit node tests/desktop-display.test.mjs
      - name: Build versioned static game
        env:
          PUBLIC_BASE_URL: https://angusqaq.github.io/PLK-BPII-Game/
        run: npm run build
      - name: Test standalone HTML with networking disabled
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node tests/offline.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
